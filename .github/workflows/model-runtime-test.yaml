name: Model Runtime Test

on:
  push:
    branches: [ xinyue/runtime-test ]
  workflow_dispatch:
    inputs:
      filter_pattern:
        description: "Optional regex pattern to filter model names (e.g., 'mistral|llama')"
        required: false
        default: ""
        type: string
      max_parallel:
        description: "Maximum number of parallel runners (models will be batched)"
        required: false
        default: "2"
        type: string

env:
  K8S_NAMESPACE: actions-runner-system

jobs:
  discover-models:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.discover.outputs.batches }}
      batch_count: ${{ steps.discover.outputs.batch_count }}
      model_count: ${{ steps.discover.outputs.model_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover models and create batches
        id: discover
        run: |
          echo "Discovering models with matching runtime and service files..."

          MODELS_JSON="[]"
          MODEL_COUNT=0

          # Find all model YAML files
          for model_file in $(find config/models -name "*.yaml" -type f | sort); do
            # Extract org and model filename
            # Pattern: config/models/<org>/<model-name>.yaml
            rel_path="${model_file#config/models/}"
            org=$(dirname "$rel_path")
            model_filename=$(basename "$rel_path" .yaml)

            # Read the model name from the YAML metadata
            model_name=$(grep -E "^  name:" "$model_file" | head -1 | awk '{print $2}' | tr -d '"')

            if [ -z "$model_name" ]; then
              echo "WARNING: Could not extract model name from $model_file, skipping..."
              continue
            fi

            # Check for corresponding runtime file
            # Runtime naming pattern: <model-name>-rt.yaml or srt-<model-name>-rt.yaml
            runtime_file=""
            for rt_pattern in "config/runtimes/srt/${org}/${model_name}-rt.yaml" \
                             "config/runtimes/srt/${org}/$(echo "$model_filename" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')-rt.yaml"; do
              if [ -f "$rt_pattern" ]; then
                runtime_file="$rt_pattern"
                break
              fi
            done

            # Try lowercase org name as well
            if [ -z "$runtime_file" ]; then
              org_lower=$(echo "$org" | tr '[:upper:]' '[:lower:]')
              for rt_pattern in "config/runtimes/srt/${org_lower}/${model_name}-rt.yaml" \
                               "config/runtimes/srt/${model_name}-rt.yaml"; do
                if [ -f "$rt_pattern" ]; then
                  runtime_file="$rt_pattern"
                  break
                fi
              done
            fi

            if [ -z "$runtime_file" ]; then
              echo "SKIP: No runtime file found for model $model_name (file: $model_file)"
              continue
            fi

            # Check for corresponding service file
            service_file=""
            for svc_pattern in "config/samples/isvc/${org}/${model_name}.yaml" \
                              "config/samples/isvc/${org}/$(echo "$model_filename" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g').yaml"; do
              if [ -f "$svc_pattern" ]; then
                service_file="$svc_pattern"
                break
              fi
            done

            # Try lowercase org name as well
            if [ -z "$service_file" ]; then
              org_lower=$(echo "$org" | tr '[:upper:]' '[:lower:]')
              for svc_pattern in "config/samples/isvc/${org_lower}/${model_name}.yaml" \
                                "config/samples/isvc/${model_name}.yaml"; do
                if [ -f "$svc_pattern" ]; then
                  service_file="$svc_pattern"
                  break
                fi
              done
            fi

            if [ -z "$service_file" ]; then
              echo "SKIP: No service file found for model $model_name (file: $model_file)"
              continue
            fi

            # Extract runtime name from runtime file
            runtime_name=$(grep -E "^  name:" "$runtime_file" | head -1 | awk '{print $2}' | tr -d '"')

            # Apply filter pattern if specified
            FILTER_PATTERN="${{ github.event.inputs.filter_pattern }}"
            if [ -n "$FILTER_PATTERN" ]; then
              if ! echo "$model_name" | grep -qE "$FILTER_PATTERN"; then
                echo "SKIP: Model $model_name does not match filter pattern '$FILTER_PATTERN'"
                continue
              fi
            fi

            echo "FOUND: $model_name"
            echo "  Model file: $model_file"
            echo "  Runtime file: $runtime_file"
            echo "  Service file: $service_file"
            echo "  Runtime name: $runtime_name"

            # Add to JSON array
            MODEL_ENTRY=$(jq -n \
              --arg model_name "$model_name" \
              --arg model_file "$model_file" \
              --arg runtime_file "$runtime_file" \
              --arg runtime_name "$runtime_name" \
              --arg service_file "$service_file" \
              --arg org "$org" \
              '{
                model_name: $model_name,
                model_file: $model_file,
                runtime_file: $runtime_file,
                runtime_name: $runtime_name,
                service_file: $service_file,
                org: $org
              }')

            MODELS_JSON=$(echo "$MODELS_JSON" | jq --argjson entry "$MODEL_ENTRY" '. += [$entry]')
            MODEL_COUNT=$((MODEL_COUNT + 1))
          done

          echo ""
          echo "=========================================="
          echo "Total models found with runtime and service: $MODEL_COUNT"
          echo "=========================================="

          # Get max_parallel value
          MAX_PARALLEL="${{ github.event.inputs.max_parallel }}"
          if [ -z "$MAX_PARALLEL" ]; then
            MAX_PARALLEL=2
          fi

          echo "Max parallel runners: $MAX_PARALLEL"

          # Calculate batch size and create batches
          if [ $MODEL_COUNT -eq 0 ]; then
            BATCHES_JSON="[]"
            BATCH_COUNT=0
          else
            # Calculate how many models per batch (ceiling division)
            BATCH_SIZE=$(( (MODEL_COUNT + MAX_PARALLEL - 1) / MAX_PARALLEL ))
            echo "Models per batch: $BATCH_SIZE"

            # Create batches - each batch contains a list of models
            BATCHES_JSON=$(echo "$MODELS_JSON" | jq -c --argjson size "$BATCH_SIZE" '
              [range(0; length; $size)] as $indices |
              [$indices[] as $i | .[$i:$i+$size]] |
              to_entries |
              map({batch_index: .key, models: .value})
            ')
            BATCH_COUNT=$(echo "$BATCHES_JSON" | jq 'length')
          fi

          echo ""
          echo "=========================================="
          echo "Created $BATCH_COUNT batches"
          echo "=========================================="

          # Output for matrix strategy
          echo "batches=$(echo "$BATCHES_JSON" | jq -c '.')" >> $GITHUB_OUTPUT
          echo "batch_count=$BATCH_COUNT" >> $GITHUB_OUTPUT
          echo "model_count=$MODEL_COUNT" >> $GITHUB_OUTPUT

          # Also output the batch distribution for debugging
          echo "Batch distribution:"
          echo "$BATCHES_JSON" | jq -r '.[] | "Batch \(.batch_index): \(.models | length) models - \([.models[].model_name] | join(", "))"'

  test-batch:
    needs: discover-models
    if: needs.discover-models.outputs.batch_count != '0'
    runs-on: k8s-runner
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.discover-models.outputs.batches) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.1'

      - name: Test batch ${{ matrix.batch.batch_index }}
        id: test
        run: |
          set +e  # Don't exit on error, we want to capture results

          NAMESPACE="${{ env.K8S_NAMESPACE }}"
          BATCH_INDEX="${{ matrix.batch.batch_index }}"
          MODELS_JSON='${{ toJson(matrix.batch.models) }}'

          echo "=========================================="
          echo "Testing batch $BATCH_INDEX"
          echo "Namespace: $NAMESPACE"
          echo "=========================================="

          # Create results directory
          mkdir -p test-results

          # Get total models in this batch
          TOTAL_MODELS=$(echo "$MODELS_JSON" | jq 'length')
          echo "Models in this batch: $TOTAL_MODELS"

          # Process each model in the batch sequentially
          MODEL_INDEX=0
          echo "$MODELS_JSON" | jq -c '.[]' | while read -r MODEL; do
            MODEL_INDEX=$((MODEL_INDEX + 1))

            MODEL_NAME=$(echo "$MODEL" | jq -r '.model_name')
            MODEL_FILE=$(echo "$MODEL" | jq -r '.model_file')
            RUNTIME_FILE=$(echo "$MODEL" | jq -r '.runtime_file')
            RUNTIME_NAME=$(echo "$MODEL" | jq -r '.runtime_name')
            SERVICE_FILE=$(echo "$MODEL" | jq -r '.service_file')
            ORG=$(echo "$MODEL" | jq -r '.org')

            echo ""
            echo "=========================================="
            echo "[$MODEL_INDEX/$TOTAL_MODELS] Testing model: $MODEL_NAME"
            echo "=========================================="

            # Initialize result
            RESULT="PENDING"
            ERROR_MSG=""

            # Extract the served-model-name from the runtime file for API calls
            SERVED_MODEL_NAME=$(grep -A1 -- "--served-model-name" "$RUNTIME_FILE" | tail -1 | sed 's/^[[:space:]]*- //' | tr -d '"' || echo "$MODEL_NAME")
            echo "Served model name: $SERVED_MODEL_NAME"

            # Step 1: Apply model YAML
            echo "Applying model: $MODEL_FILE"
            if ! kubectl apply -f "$MODEL_FILE" 2>&1; then
              ERROR_MSG="Failed to apply model YAML"
              RESULT="FAILED"
            fi

            # Step 2: Wait for ClusterBaseModel to be ready
            if [ "$RESULT" != "FAILED" ]; then
              echo "Waiting for ClusterBaseModel to be ready..."
              MODEL_TIMEOUT=3600  # 60 minutes
              MODEL_ELAPSED=0

              while [ $MODEL_ELAPSED -lt $MODEL_TIMEOUT ]; do
                MODEL_READY=$(kubectl get clusterbasemodel "$MODEL_NAME" -o jsonpath='{.status.state}' 2>/dev/null || echo "Unknown")

                echo "ClusterBaseModel Ready: $MODEL_READY - ${MODEL_ELAPSED}s elapsed"

                if [ "$MODEL_READY" = "Ready" ]; then
                  echo "ClusterBaseModel is ready!"
                  break
                fi

                # Check for failure
                if echo "$MODEL_READY" | grep -qiE "^Failed$|Error"; then
                  echo "ClusterBaseModel failed"
                  ERROR_MSG="ClusterBaseModel failed"
                  RESULT="FAILED"
                  break
                fi

                sleep 30
                MODEL_ELAPSED=$((MODEL_ELAPSED + 30))
              done

              if [ $MODEL_ELAPSED -ge $MODEL_TIMEOUT ] && [ "$RESULT" != "FAILED" ]; then
                ERROR_MSG="Timeout waiting for ClusterBaseModel to be ready"
                RESULT="FAILED"
              fi
            fi

            # Step 3: Apply runtime YAML
            if [ "$RESULT" != "FAILED" ]; then
              echo "Applying runtime: $RUNTIME_FILE"
              if ! kubectl apply -f "$RUNTIME_FILE" 2>&1; then
                ERROR_MSG="Failed to apply runtime YAML"
                RESULT="FAILED"
              fi
            fi

            # Step 4: Apply service YAML
            if [ "$RESULT" != "FAILED" ]; then
              echo "Applying service: $SERVICE_FILE"
              # Create a temp file with Namespace resource and namespace field removed, and minReplicas fixed
              TEMP_SERVICE="/tmp/service-$MODEL_NAME.yaml"

              # Remove Namespace resource (kind: Namespace), namespace field, and fix minReplicas
              awk '
                BEGIN { skip=0 }
                /^---/ { skip=0; next }
                /^kind:[[:space:]]*Namespace/ { skip=1 }
                skip { next }
                /^[[:space:]]*namespace:/ { next }
                { print }
              ' "$SERVICE_FILE" | sed 's/minReplicas: 0/minReplicas: 1/' > "$TEMP_SERVICE"

              if ! kubectl apply -f "$TEMP_SERVICE" -n "$NAMESPACE" 2>&1; then
                ERROR_MSG="Failed to apply service YAML"
                RESULT="FAILED"
              fi
              rm -f "$TEMP_SERVICE"
            fi

            # Step 5: Wait for InferenceService EngineReady and RouterReady conditions
            if [ "$RESULT" != "FAILED" ]; then
              echo "Waiting for InferenceService EngineReady and RouterReady conditions..."
              TIMEOUT=600  # 10 minutes
              ELAPSED=0

              while [ $ELAPSED -lt $TIMEOUT ]; do
                ENGINE_READY=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="EngineReady")].status}' 2>/dev/null || echo "Unknown")
                ENGINE_REASON=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="EngineReady")].reason}' 2>/dev/null || echo "")
                ISVC_READY=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="RouterReady")].status}' 2>/dev/null || echo "Unknown")
                ISVC_REASON=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="RouterReady")].reason}' 2>/dev/null || echo "")

                echo "InferenceService EngineReady: $ENGINE_READY (reason: $ENGINE_REASON), Ready: $ISVC_READY (reason: $ISVC_REASON) - ${ELAPSED}s elapsed"

                if [ "$ENGINE_READY" = "True" ] && [ "$ISVC_READY" = "True" ]; then
                  echo "InferenceService is ready!"
                  break
                fi

                # Check for terminal failure conditions on EngineReady
                if [ "$ENGINE_READY" = "False" ]; then
                  ENGINE_MESSAGE=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="EngineReady")].message}' 2>/dev/null || echo "")
                  # Check if it's a permanent failure (not just pending)
                  if echo "$ENGINE_REASON" | grep -qE "RevisionFailed|ContainerCreating|Error|Failed"; then
                    echo "InferenceService engine in error state: $ENGINE_REASON - $ENGINE_MESSAGE"
                    ERROR_MSG="InferenceService engine failed: $ENGINE_REASON - $ENGINE_MESSAGE"
                    RESULT="FAILED"
                    break
                  fi
                fi

                # Check for terminal failure conditions on Ready
                if [ "$ISVC_READY" = "False" ]; then
                  ISVC_MESSAGE=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null || echo "")
                  # Check if it's a permanent failure (not just pending)
                  if echo "$ISVC_REASON" | grep -qE "RevisionFailed|Error|Failed"; then
                    echo "InferenceService router in error state: $ISVC_REASON - $ISVC_MESSAGE"
                    ERROR_MSG="InferenceService router failed: $ISVC_REASON - $ISVC_MESSAGE"
                    RESULT="FAILED"
                    break
                  fi
                fi

                sleep 20
                ELAPSED=$((ELAPSED + 20))
              done

              if [ $ELAPSED -ge $TIMEOUT ] && [ "$RESULT" != "FAILED" ]; then
                ERROR_MSG="Timeout waiting for InferenceService EngineReady and Ready"
                RESULT="FAILED"
              fi
            fi

            # Step 6: Verify pods are running
            if [ "$RESULT" != "FAILED" ]; then
              echo "Verifying pods are running..."

              # Check engine pod
              ENGINE_READY=$(kubectl get pods -n "$NAMESPACE" -l "component=engine" -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
              ROUTER_READY=$(kubectl get pods -n "$NAMESPACE" -l "component=router" -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")

              echo "Engine pod ready: $ENGINE_READY, Router pod ready: $ROUTER_READY"

              if [ "$ENGINE_READY" != "true" ]; then
                # Check for pod errors
                POD_STATUSES=$(kubectl get pods -n "$NAMESPACE" -l "component=engine" -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || echo "")
                if [ -n "$POD_STATUSES" ]; then
                  ERROR_MSG="Engine pod not ready: $POD_STATUSES"
                  RESULT="FAILED"
                fi
              fi

              if [ "$RESULT" != "FAILED" ] && [ "$ROUTER_READY" != "true" ]; then
                POD_STATUSES=$(kubectl get pods -n "$NAMESPACE" -l "component=router" -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || echo "")
                if [ -n "$POD_STATUSES" ]; then
                  ERROR_MSG="Router pod not ready: $POD_STATUSES"
                  RESULT="FAILED"
                fi
              fi

              if [ "$RESULT" != "FAILED" ]; then
                echo "All pods verified!"
                RESULT="PASSED"
              fi
            fi

            # Step 7: Test model endpoint (chat completions or embeddings)
            if [ "$RESULT" = "PASSED" ]; then
              echo "Testing model endpoint..."

              # Get the InferenceService status URL
              ISVC_URL=$(kubectl get inferenceservice "$MODEL_NAME" -n "$NAMESPACE" -o jsonpath='{.status.url}' 2>/dev/null)

              if [ -n "$ISVC_URL" ]; then
                echo "InferenceService URL: $ISVC_URL"

                # First get the model ID from /v1/models
                MODELS_RESPONSE=$(curl -s --max-time 30 "${ISVC_URL}/v1/models" 2>&1)
                ACTUAL_MODEL_ID=$(echo "$MODELS_RESPONSE" | jq -r '.data[0].id // empty' 2>/dev/null)

                if [ -z "$ACTUAL_MODEL_ID" ]; then
                  ACTUAL_MODEL_ID="$MODEL_NAME"
                fi
                echo "Using model ID: $ACTUAL_MODEL_ID"

                ENDPOINT_TESTED=""

                # Try /v1/chat/completions endpoint first
                echo "Trying /v1/chat/completions..."
                CHAT_RESPONSE=$(curl -s --max-time 120 "${ISVC_URL}/v1/chat/completions" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "model": "'"$ACTUAL_MODEL_ID"'",
                    "messages": [{"role": "user", "content": "Say hello in one word"}],
                    "max_tokens": 10,
                    "temperature": 0.7
                  }' 2>&1)
                CHAT_EXIT=$?

                if [ $CHAT_EXIT -eq 0 ] && echo "$CHAT_RESPONSE" | grep -q '"choices"'; then
                  echo "Chat completions test PASSED"
                  ENDPOINT_TESTED="chat"
                else
                  echo "Chat endpoint not available, trying embeddings endpoint..."

                  # Try /v1/embeddings endpoint (for embedding models)
                  EMBED_RESPONSE=$(curl -s --max-time 120 "${ISVC_URL}/v1/embeddings" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "model": "'"$ACTUAL_MODEL_ID"'",
                      "input": "Hello world"
                    }' 2>&1)
                  EMBED_EXIT=$?

                  if [ $EMBED_EXIT -eq 0 ] && echo "$EMBED_RESPONSE" | grep -q '"embedding"'; then
                    echo "Embeddings test PASSED (this is an embedding model)"
                    ENDPOINT_TESTED="embeddings"
                  else
                    echo "Warning: Neither chat nor embeddings endpoint responded successfully (non-fatal)"
                    echo "Chat response: $CHAT_RESPONSE"
                    echo "Embeddings response: $EMBED_RESPONSE"
                  fi
                fi

                if [ -n "$ENDPOINT_TESTED" ]; then
                  echo "Endpoint test completed successfully using: $ENDPOINT_TESTED"
                fi
              else
                echo "InferenceService URL not available, skipping endpoint test"
              fi
            fi

            # Output result
            echo ""
            echo "=========================================="
            echo "Result for $MODEL_NAME: $RESULT"
            if [ -n "$ERROR_MSG" ]; then
              echo "Error: $ERROR_MSG"
            fi
            echo "=========================================="

            # Save result to file for artifact upload
            jq -n \
              --arg model_name "$MODEL_NAME" \
              --arg org "$ORG" \
              --arg namespace "$NAMESPACE" \
              --arg result "$RESULT" \
              --arg error "$ERROR_MSG" \
              '{
                model_name: $model_name,
                org: $org,
                namespace: $namespace,
                result: $result,
                error: $error
              }' > "test-results/${MODEL_NAME}.json"

            # Cleanup resources for this model before moving to next
            echo "Cleaning up resources for $MODEL_NAME..."

            # Delete InferenceService first
            kubectl delete inferenceservice "$MODEL_NAME" -n "$NAMESPACE" --ignore-not-found=true 2>/dev/null || true

            # Wait for pods to terminate
            sleep 10

            # Delete cluster-scoped resources
            kubectl delete -f "$RUNTIME_FILE" --ignore-not-found=true 2>/dev/null || true
            kubectl delete -f "$MODEL_FILE" --ignore-not-found=true 2>/dev/null || true

            echo "Cleanup completed for $MODEL_NAME"
            echo ""
          done

          echo "=========================================="
          echo "Batch $BATCH_INDEX completed"
          echo "=========================================="

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-batch-${{ matrix.batch.batch_index }}
          path: test-results/
          retention-days: 7

  summary:
    needs: [discover-models, test-batch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-batch-*
          path: all-results
          merge-multiple: false

      - name: Generate summary
        run: |
          echo "## Model Runtime Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Total Models Discovered:** ${{ needs.discover-models.outputs.model_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Number of Batches:** ${{ needs.discover-models.outputs.batch_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Aggregate results from artifacts
          PASSED=0
          FAILED=0
          TOTAL=0

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Organization | Status | Error |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------------|--------|-------|" >> $GITHUB_STEP_SUMMARY

          # Process each result file
          if [ -d "all-results" ]; then
            for result_dir in all-results/test-results-batch-*; do
              if [ -d "$result_dir" ]; then
                for result_file in "$result_dir"/*.json; do
                  if [ -f "$result_file" ]; then
                    MODEL_NAME=$(jq -r '.model_name' "$result_file")
                    ORG=$(jq -r '.org' "$result_file")
                    RESULT=$(jq -r '.result' "$result_file")
                    ERROR=$(jq -r '.error // ""' "$result_file")

                    TOTAL=$((TOTAL + 1))

                    if [ "$RESULT" = "PASSED" ]; then
                      PASSED=$((PASSED + 1))
                      STATUS_EMOJI="✅"
                    else
                      FAILED=$((FAILED + 1))
                      STATUS_EMOJI="❌"
                    fi

                    # Truncate error message if too long
                    if [ ${#ERROR} -gt 50 ]; then
                      ERROR="${ERROR:0:47}..."
                    fi

                    echo "| $MODEL_NAME | $ORG | $STATUS_EMOJI $RESULT | $ERROR |" >> $GITHUB_STEP_SUMMARY
                  fi
                done
              fi
            done
          fi

          # If no results found, show the models that were supposed to be tested
          if [ $TOTAL -eq 0 ]; then
            BATCHES='${{ needs.discover-models.outputs.batches }}'
            if [ -n "$BATCHES" ] && [ "$BATCHES" != "[]" ]; then
              echo "$BATCHES" | jq -r '.[].models[] | "| \(.model_name) | \(.org) | ⚠️ No result | See job logs |"' >> $GITHUB_STEP_SUMMARY
              TOTAL=$(echo "$BATCHES" | jq '[.[].models | length] | add')
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tested | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY

          if [ $TOTAL -gt 0 ]; then
            PASS_RATE=$((PASSED * 100 / TOTAL))
            echo "| Pass Rate | ${PASS_RATE}% |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Models are divided into batches to minimize Docker image pulls." >> $GITHUB_STEP_SUMMARY
          echo "Each batch runs on a single runner and tests models sequentially." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each model test performs the following steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Apply Model YAML** - Creates the ClusterBaseModel resource" >> $GITHUB_STEP_SUMMARY
          echo "2. **Wait for Model Ready** - Waits up to 5 minutes for ClusterBaseModel Ready condition" >> $GITHUB_STEP_SUMMARY
          echo "3. **Apply Runtime YAML** - Creates the ClusterServingRuntime resource" >> $GITHUB_STEP_SUMMARY
          echo "4. **Apply Service YAML** - Creates the InferenceService in actions-runner-system namespace" >> $GITHUB_STEP_SUMMARY
          echo "5. **Wait for EngineReady** - Waits up to 60 minutes for InferenceService EngineReady condition" >> $GITHUB_STEP_SUMMARY
          echo "6. **Verify Pods** - Confirms engine and router pods are running" >> $GITHUB_STEP_SUMMARY
          echo "7. **Test Endpoint** - Tests /v1/chat/completions or /v1/embeddings depending on model type" >> $GITHUB_STEP_SUMMARY
          echo "8. **Cleanup** - Deletes InferenceService, Runtime, and Model resources" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Models without corresponding runtime or service files were skipped during discovery" >> $GITHUB_STEP_SUMMARY
          echo "- Test passes when InferenceService EngineReady condition is True and pods are running" >> $GITHUB_STEP_SUMMARY
          echo "- Check individual job logs for detailed output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Generated by Model Runtime Test workflow_" >> $GITHUB_STEP_SUMMARY

          # Fail the job if any tests failed
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED out of $TOTAL tests failed"
            exit 1
          fi
